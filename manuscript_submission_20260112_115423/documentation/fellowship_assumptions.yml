# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Fellowship Assumptions for Workforce Projections
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
#
# This file contains fellowship training position assumptions used to project
# future subspecialty workforce.
#
# Last updated: 2026-01-12
# Source: ACGME fellowship position allocations
#
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# Default scenario (current best estimates)
default:
  FPMRS: 60  # Female Pelvic Medicine & Reconstructive Surgery
  GO: 50     # Gynecologic Oncology
  MIG: 45    # Minimally Invasive Gynecologic Surgery

# Alternative scenarios for sensitivity analysis

# Optimistic scenario: Increased fellowship positions
optimistic:
  FPMRS: 70
  GO: 60
  MIG: 55

# Pessimistic scenario: Decreased fellowship positions
pessimistic:
  FPMRS: 50
  GO: 40
  MIG: 35

# Historical scenario: Pre-2026 assumptions (for comparison)
historical_2025:
  FPMRS: 47
  GO: 60
  MIG: 51

# Status quo scenario: Maintain current production
status_quo:
  FPMRS: 55
  GO: 55
  MIG: 45

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Notes:
#
# - FPMRS: Also known as Urogynecology or URPS
# - Numbers represent annual fellowship graduates entering workforce
# - Scenarios can be modified to test different policy interventions
# - Run scenario comparison with: Rscript cliff/code/04_compare_scenarios.R
#
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
