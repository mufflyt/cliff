# Reusable core of cliff's CI. Called by ci.yml (push/PR) and nightly.yml
# (02:17 America/Denver). Everything shared lives here exactly once so the
# nightly run cannot drift from the per-push run.
#
# `deep: true` widens the R/OS matrix and turns on the tiers that need extra
# tooling or minutes: the manuscript render gate and installed-package smoke
# across platforms.
#
# Dependency installation deliberately does NOT use pak. pak has failed
# repo-wide here ("there is no package called 'pak'"); use-public-rspm points
# the default repo at Posit Package Manager, so install.packages() pulls
# precompiled Linux binaries and remotes reads DESCRIPTION for us. That also
# sidesteps the reason a local restore takes ~45 minutes on Intel macOS: on
# Ubuntu essentially everything, duckdb and sf included, arrives prebuilt.

name: _core

on:
  workflow_call:
    inputs:
      deep:
        description: Run the wide matrix and the slow tiers
        type: boolean
        default: false
      render_docs:
        description: >-
          Render the manuscript and supplement even when deep is false. Set by the
          per-PR workflow when a change can affect what gets typeset. Rendering is
          the only check that catches an .Rmd which parses, whose chunks execute in
          isolation, and which still cannot knit -- see issue #44 and the cf()
          incident in CLAUDE.md.
        type: boolean
        default: false

permissions:
  contents: read

env:
  R_KEEP_PKG_SOURCE: yes
  _R_CHECK_FORCE_SUGGESTS_: false
  # Tests that need the isochrones monorepo skip cleanly; make that explicit
  # rather than accidental, so a CI pass means "everything runnable ran".
  CLIFF_ISOCHRONES_ROOT: ""
  # The repo's .Rprofile activates renv. In CI that is actively harmful: it
  # redirects install.packages() into renv's own cache library, which any
  # Rscript run that skips .Rprofile (or runs from another directory) then
  # cannot see. Dependencies here are installed into R_LIBS_USER on purpose,
  # by remotes against RSPM binaries. The one job that DOES want renv
  # (nightly's lockfile_restore) calls renv:: explicitly.
  RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
  # mufflyaccess is a GitHub dependency (DESCRIPTION Remotes). remotes resolves
  # that pin through the GitHub API, which returns 401 unauthenticated from
  # Actions runners. github.token is always present and needs no secret
  # inheritance, unlike secrets.GITHUB_TOKEN in a called workflow.
  GITHUB_PAT: ${{ github.token }}

jobs:
  # ---------------------------------------------------------------------------
  # Cheap, fast-failing repository invariants. Nothing here compiles anything,
  # so it reports in well under a minute and catches the classes of error that
  # are embarrassing to discover after a 20-minute matrix.
  # ---------------------------------------------------------------------------
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install the few packages the preflight checks need
        shell: Rscript {0}
        run: install.packages(c("jsonlite", "desc"))

      - name: Dependency pins agree (DESCRIPTION Remotes vs renv.lock)
        run: Rscript --no-init-file scripts/ci/check_pins.R

      - name: Source hygiene (no machine paths, no load-time side effects)
        run: Rscript --no-init-file scripts/ci/check_source_hygiene.R

      - name: Bundled app artifacts match data/ byte for byte
        run: Rscript --no-init-file scripts/ci/check_bundled_artifacts.R

      - name: DESCRIPTION is parseable and complete
        shell: Rscript {0}
        run: |
          d <- desc::desc(file = "DESCRIPTION")
          for (f in c("Package", "Version", "License", "Description", "Title")) {
            v <- tryCatch(d$get_field(f), error = function(e) NA_character_)
            if (is.na(v) || !nzchar(v)) stop("DESCRIPTION is missing ", f)
          }
          cat("DESCRIPTION OK:", d$get_field("Package"), d$get_field("Version"), "\n")

      - name: .Rbuildignore entries are valid regular expressions
        shell: Rscript {0}
        run: |
          # Every line of .Rbuildignore is a regex, comments included. A comment
          # containing an unbalanced "(" once broke `R CMD build` outright.
          ln <- readLines(".Rbuildignore", warn = FALSE)
          ln <- ln[nzchar(trimws(ln))]
          bad <- character(0)
          for (l in ln) {
            ok <- tryCatch({ grepl(l, "probe", perl = FALSE); TRUE },
                           error = function(e) FALSE, warning = function(w) FALSE)
            if (!ok) bad <- c(bad, l)
          }
          if (length(bad)) {
            cat("Invalid .Rbuildignore regex(es):\n"); cat(paste0("  ", bad, collapse = "\n"), "\n")
            stop("`.Rbuildignore` lines must be valid regular expressions")
          }
          cat(length(ln), ".Rbuildignore patterns, all valid\n")

      - name: R sources contain no unescaped non-ASCII
        shell: Rscript {0}
        run: |
          bad <- list()
          for (f in list.files("R", pattern = "[.]R$", full.names = TRUE)) {
            ln <- readLines(f, warn = FALSE)
            for (i in seq_along(ln)) {
              if (grepl("^\\s*#", ln[i])) next          # comments may be UTF-8
              if (any(utf8ToInt(ln[i]) > 127))
                bad[[length(bad) + 1L]] <- sprintf("%s:%d", f, i)
            }
          }
          if (length(bad)) {
            cat("Non-ASCII outside comments:\n", paste0("  ", unlist(bad), collapse = "\n"), "\n")
            stop("escape non-ASCII in R code as \\uXXXX")
          }
          cat("no unescaped non-ASCII in R/\n")

      - name: Summary
        if: always()
        run: |
          {
            echo "### Preflight"
            echo ""
            echo "Pins, DESCRIPTION, \`.Rbuildignore\` regexes, and non-ASCII."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # R CMD check. The lockfile pins R 4.4.2; the acceptance gate validated 4.5.3.
  # Both are checked on every push so neither can rot. `deep` adds macOS and
  # Windows, which are genuine platform differences for the spatial stack.
  # ---------------------------------------------------------------------------
  matrix_setup:
    name: resolve check matrix
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          # 4.4.2 is what renv.lock pins; 4.5.3 is what the acceptance gate
          # validated. Both run always so neither can rot. `deep` adds macOS
          # and Windows, genuine platform differences for the spatial stack.
          #
          # R-devel is deliberately NOT here. Posit Package Manager serves no
          # binaries for devel, so the whole tree compiles from source
          # single-threaded -- duckdb alone is 1802 .cpp files. It timed out in
          # the dependency install on all four nightly runs and never once
          # reached R CMD check: 60 minutes a night for no signal. cliff is not
          # on CRAN, so the forward-compatibility warning devel exists to give
          # is covered by the `release` row one cycle later.
          base='{"os":"ubuntu-latest","r":"4.4.2","experimental":false},
                {"os":"ubuntu-latest","r":"4.5.3","experimental":false},
                {"os":"ubuntu-latest","r":"release","experimental":false}'
          if [ "${{ inputs.deep }}" = "true" ]; then
            extra=',{"os":"macos-latest","r":"release","experimental":false},
                   {"os":"windows-latest","r":"release","experimental":false}'
          else
            extra=''
          fi
          echo "matrix=[$(echo "$base$extra" | tr -d '\n ')]" >> "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.os }} · R ${{ matrix.r }})
    needs: matrix_setup
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix_setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libpng-dev libjpeg-dev libtiff5-dev libcairo2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev

      - name: Cache R library
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # setup-r exports R_LIBS_USER; this is where install.packages() and
          # remotes::install_deps() put everything.
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-R${{ matrix.r }}-${{ hashFiles('DESCRIPTION', 'renv.lock') }}
          restore-keys: ${{ runner.os }}-R${{ matrix.r }}-

      - name: Install dependencies (remotes + RSPM binaries, no pak)
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "rcmdcheck"))
          # Suggests are installed too so the suite runs as fully as possible;
          # _R_CHECK_FORCE_SUGGESTS_=false keeps a single unavailable Suggest
          # from failing the whole check.
          remotes::install_deps(dependencies = TRUE, upgrade = "never")

      - name: R CMD check
        shell: Rscript {0}
        run: |
          # Deliberately NOT --as-cran. cliff is not going to CRAN, and there is
          # already an unrelated package named `cliff` there (Randy Lai's, now
          # 0.1.2). --as-cran's incoming-feasibility check compares against it
          # and emits a WARNING about "insufficient package version" and a
          # changed maintainer, plus one for `Remotes` being an unknown field --
          # none of which say anything about this package's health.
          res <- rcmdcheck::rcmdcheck(
            args        = "--no-manual",
            error_on    = "warning",         # NOTEs allowed, WARNINGs are not
            check_dir   = "check"
          )

      - name: NOTE fingerprint
        if: always() && runner.os == 'Linux' && matrix.r == '4.4.2'
        shell: bash
        run: |
          # One configuration owns the fingerprint. NOTEs legitimately differ
          # across platforms and R versions (installed size, available Suggests),
          # so comparing every job against one baseline would be noise.
          log=$(find check -name 00check.log | head -1)
          if [ -z "$log" ]; then echo "no 00check.log found"; exit 1; fi
          Rscript --no-init-file scripts/ci/check_note_fingerprint.R "$log"

      - name: Upload check output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-${{ matrix.os }}-R${{ matrix.r }}
          path: check/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The full testthat suite, run against the SOURCE tree (so the ~89 files that
  # need scripts/ and manuscript/ actually execute), plus coverage.
  #
  # Local baseline on a bare checkout with no isochrones monorepo:
  #   2960 pass · 0 fail · 27 skip, in ~85 s.
  # ---------------------------------------------------------------------------
  test:
    name: test suite + coverage
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libpng-dev libjpeg-dev libtiff5-dev libcairo2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev

      - name: Install dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "testthat", "covr", "xml2"))
          remotes::install_deps(dependencies = TRUE, upgrade = "never")

          # roxygen2 must match RoxygenNote exactly. Different roxygen versions
          # emit different .Rd for identical sources, so installing whatever is
          # current on CRAN (8.1.0 today, against RoxygenNote 7.3.3) makes the
          # docs-currency check report every topic as stale. RoxygenNote is not
          # a dependency pin, but it does record which generator produced man/,
          # and that is exactly what this check needs to compare against.
          note <- read.dcf("DESCRIPTION")[1, "RoxygenNote"]
          cat("RoxygenNote:", note, "\n")
          remotes::install_version("roxygen2", version = note,
                                   upgrade = "never", quiet = TRUE)
          cat("roxygen2 installed:", as.character(packageVersion("roxygen2")), "\n")
          stopifnot(identical(as.character(packageVersion("roxygen2")), unname(note)))

      - name: Install cliff
        run: R CMD INSTALL --with-keep.source .

      - name: Documentation is current with roxygen comments
        shell: Rscript {0}
        run: |
          # Catches the "edited the .Rd by hand" and "forgot to re-document"
          # failure modes. roxygen2's own version is pinned by RoxygenNote so
          # this compares like with like.
          before <- sort(list.files("man", full.names = TRUE))
          hash_before <- vapply(before, function(f) paste(tools::md5sum(f)), "")
          suppressMessages(roxygen2::roxygenise(".", roclets = c("rd", "namespace")))
          after <- sort(list.files("man", full.names = TRUE))
          changed <- setdiff(after, before)
          removed <- setdiff(before, after)
          same <- intersect(before, after)
          diffs <- same[vapply(same, function(f) paste(tools::md5sum(f)), "") != hash_before[same]]
          if (length(c(changed, removed, diffs))) {
            cat("man/ is out of date. Run devtools::document() and commit:\n")
            for (f in diffs)   cat("  modified:", f, "\n")
            for (f in changed) cat("  missing :", f, "\n")
            for (f in removed) cat("  stale   :", f, "\n")
            stop("documentation not current")
          }
          cat("man/ is current (", length(same), "topics )\n")

      - name: Run the suite (with completion accounting)
        env:
          CLIFF_CI_OUT: ${{ runner.temp }}/ci-out
        run: Rscript --no-init-file scripts/ci/run_suite.R

      - name: Assert the suite actually finished
        env:
          CLIFF_CI_OUT: ${{ runner.temp }}/ci-out
        run: |
          # The sentinel is written only after test_dir() returns. A quit(),
          # segfault, OOM kill, job timeout or reporter crash all leave it
          # absent, and none of those may be reported as a pass.
          if [ ! -f "$CLIFF_CI_OUT/suite-completed.txt" ]; then
            echo "::error::suite completion sentinel missing - the suite did not run to completion"
            exit 1
          fi
          echo "sentinel:"; cat "$CLIFF_CI_OUT/suite-completed.txt"
          {
            echo "### Test suite"
            echo ""
            echo '```'
            cat "$CLIFF_CI_OUT/suite-completed.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test accounting
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-accounting
          path: ${{ runner.temp }}/ci-out/*
          if-no-files-found: warn
          retention-days: 14

      - name: Coverage regression
        if: ${{ inputs.deep }}
        run: Rscript --no-init-file scripts/ci/check_coverage.R

  # ---------------------------------------------------------------------------
  # Installed-package semantics. This is the gap that has produced nearly every
  # real defect in this repo: devtools::load_all() sees the whole repository, an
  # installed package sees only what shipped. The suite cannot detect it because
  # the suite runs inside the repository.
  # ---------------------------------------------------------------------------
  smoke:
    name: installed-package smoke
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true

      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev

      - name: Install hard dependencies only (no Suggests)
        shell: Rscript {0}
        run: |
          install.packages("remotes")
          remotes::install_deps(
            dependencies = c("Depends", "Imports", "LinkingTo"),
            upgrade = "never")

      - name: Build and install the tarball
        run: |
          R CMD build --no-build-vignettes .
          mkdir -p "$RUNNER_TEMP/pkglib"
          R CMD INSTALL --library="$RUNNER_TEMP/pkglib" cliff_*.tar.gz

      - name: Assemble a library holding cliff and its hard dependencies only
        run: |
          # smoke_installed_package.R does .libPaths(SMOKELIB) — a single
          # directory — so SMOKELIB must contain cliff AND everything it
          # Imports, or the failure is just "cannot load cliff" and proves
          # nothing. The five Suggests were never installed in this job, so
          # linking both libraries wholesale still leaves them absent.
          mkdir -p "$RUNNER_TEMP/smokelib"
          for d in "$R_LIBS_USER"/*/ "$RUNNER_TEMP/pkglib"/*/; do
            [ -d "$d" ] || continue
            ln -sfn "${d%/}" "$RUNNER_TEMP/smokelib/$(basename "$d")"
          done
          echo "smokelib entries: $(ls -A "$RUNNER_TEMP/smokelib" | wc -l)"
          for p in data.table sf tidycensus tigris geosphere; do
            if [ -e "$RUNNER_TEMP/smokelib/$p" ]; then
              echo "ERROR: $p must be absent from the smoke library"; exit 1
            fi
          done

      - name: Smoke test with data.table/sf/tidycensus/tigris/geosphere absent
        run: |
          SMOKELIB="$RUNNER_TEMP/smokelib" Rscript --vanilla scripts/smoke_installed_package.R

      - name: Tarball size
        run: |
          sz=$(du -h cliff_*.tar.gz | cut -f1)
          echo "### Installed-package smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tarball: \`$sz\` — loads with the five Suggests absent." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gates 61-63: the Shiny applications' own test suites.
  #
  # Both apps ship testthat suites that CI had never run. They are publication
  # surface -- the apps present the same projection as the manuscript -- and the
  # main suite's app-parity guard exists because an app once carried a divergent
  # copy of a package calculation.
  # ---------------------------------------------------------------------------
  shiny:
    name: Shiny application suites
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libpng-dev libjpeg-dev libtiff5-dev libcairo2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev

      - name: Install dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "testthat", "shiny"))
          remotes::install_deps(dependencies = TRUE, upgrade = "never")

      - run: R CMD INSTALL --with-keep.source .

      - name: Run both application suites
        run: Rscript --no-init-file scripts/ci/run_shiny_suites.R

      # Gate 62: headless startup. Deep only -- it drives a real browser, which
      # is both slower and a different class of flakiness from the unit suites.
      - name: Headless app startup smoke
        if: ${{ inputs.deep }}
        continue-on-error: true
        shell: Rscript {0}
        run: |
          ok <- requireNamespace("shinytest2", quietly = TRUE) &&
                requireNamespace("chromote", quietly = TRUE)
          if (!ok) { cat("shinytest2/chromote unavailable; skipping\n"); quit(status = 0) }
          for (app in c("shiny_urps_adequacy", "shiny_urps_scenarios")) {
            cat("== ", app, " ==\n", sep = "")
            r <- tryCatch({
              d <- shinytest2::AppDriver$new(app, load_timeout = 60 * 1000,
                                             check_names = FALSE)
              on.exit(try(d$stop(), silent = TRUE), add = TRUE)
              logs <- d$get_logs()
              cat("  started and rendered\n")
              TRUE
            }, error = function(e) { cat("  FAILED: ", conditionMessage(e), "\n"); FALSE })
            if (!r) cat("  (advisory: browser startup is not a blocking gate yet)\n")
          }

  # ---------------------------------------------------------------------------
  # The manuscript render gate. rmarkdown::render() catches what parsing and
  # unit tests cannot: a helper named cf() once passed 2,853 unit tests while
  # the supplement could not render at all, because the document rebinds `cf`
  # to a data.frame sixty lines below the setup chunk.
  #
  # Needs pandoc and the full tidyverse/gt/flextable stack, so it is a deep tier.
  # ---------------------------------------------------------------------------
  render:
    name: manuscript render gate
    if: ${{ inputs.deep || inputs.render_docs }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libgit2-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libpng-dev libjpeg-dev libtiff5-dev libcairo2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev

      - name: Install dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "testthat", "rmarkdown"))
          remotes::install_deps(dependencies = TRUE, upgrade = "never")

      - name: Install cliff
        run: R CMD INSTALL --with-keep.source .

      - name: Render gate (in-suite proxies)
        env:
          CLIFF_RENDER_TESTS: "1"
        shell: Rscript {0}
        run: |
          library(testthat); library(cliff)
          res <- test_file("tests/testthat/test-ssot-no-stale-published-numbers.R",
                           reporter = "summary", stop_on_failure = TRUE)
          cat("render gate: OK\n")

      - name: Render manuscript AND supplement, then read the output
        run: Rscript --no-init-file scripts/ci/render_manuscripts.R

      - name: Determinism (two independent sessions)
        run: Rscript --no-init-file scripts/ci/check_determinism.R
