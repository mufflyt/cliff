name: contract-tests

# A MINIMAL-DEPENDENCY canary. cliff does now have full CI (ci.yml, nightly.yml,
# _core.yml, _reproducibility.yml); this job is kept because it proves something
# those cannot: that the contract-integration layer still works with base R +
# mufflyaccess + testthat alone, with no tidyverse, sf or duckdb anywhere.
#
# It gates the DATA-INDEPENDENT contract-integration
# layer that protects the cliff -> mufflyaccess projection work: the workforce
# engine additions (loader-based, pure functions), the URPS projection producer
# (reads the committed artifact + the mufflyaccess projection contract), the
# mufflyaccess version/pin gate, the unqualified-baseline guard, the
# wait-adequacy inverse (pure base-R M/M/s queueing), the CHIA<->Medicare
# all-payer workload bridge, the capacity-evidence adequacy gate, and the
# absolute-adequacy seam that anchors project()'s relative index to a gated
# absolute adequacy, and the app-absolute-parity guard that pins the Shiny app's
# standalone port of that seam to the canonical package implementation (all pure
# base R). These need only base R + mufflyaccess +
# testthat, so they run without the local cohort CSV or the sf/dplyr/duckdb
# stack. (The absolute-adequacy seam's end-to-end block additionally drives the
# calibration stack and skips cleanly where it is absent.)
#
# Also gated: the publication-integrity guards (no-stale-published-numbers,
# derived-column-identities). They read only committed CSVs and the manuscript
# sources with base R, so they need no cohort data and no tidyverse. They exist
# because the 1,295 -> 1,306 baseline migration left stale copies of the headline
# numbers in six different kinds of place -- a rounded derived column, orphaned
# artifacts, hand-written prose, a kable caption, cohort parts beside an inline
# total, and prose embedded in a data file -- and each kind hid from the checks
# that would have caught the others.
#
# The CHIA all-payer demand-bridge CALIBRATION engine (chia-demand-bridge) is
# also filtered in, but its calibration path needs the tidyverse + splines +
# broom stack; its test skips cleanly (skip_if_not_installed) where that stack
# is absent, so it never fails this minimal runner and runs for real wherever
# the full dependency tree is installed.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cliff
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out mufflyaccess (the SSOT the projection contract lives in)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: mufflyt/mufflyaccess
          path: .mufflyaccess
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true
      # Install mufflyaccess's dependencies WITHOUT pak. The r-lib
      # setup-r-dependencies action bootstraps pak, which has been failing
      # repo-wide ("there is no package called 'pak'") and blocking this gate.
      # use-public-rspm above points the default repo at Posit Package Manager,
      # so install.packages() pulls precompiled ubuntu binaries -- fast, no
      # compilation, no pak. remotes reads mufflyaccess's DESCRIPTION for us.
      - name: Install mufflyaccess dependencies (remotes + RSPM binaries, no pak)
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "testthat", "here"))
          remotes::install_deps(
            ".mufflyaccess",
            dependencies = c("Depends", "Imports", "LinkingTo")
          )
      - name: Install mufflyaccess
        run: R CMD INSTALL --with-keep.source .mufflyaccess
      - name: Run the data-independent contract + engine tests
        run: >
          Rscript -e 'library(testthat);
          testthat::test_dir("tests/testthat",
          filter = "wc-engine|urps-projection-producer|mufflyaccess|no-unqualified-urps-baseline|wait-adequacy|chia-medicare-bridge|chia-demand-bridge|capacity-evidence|absolute-adequacy-seam|app-absolute-parity|no-stale-published-numbers|derived-column-identities",
          stop_on_failure = TRUE);
          cat("cliff contract integration: OK\n")'
