# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Fellowship Assumptions for Workforce Projections
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
#
# This configuration file defines the fellowship training assumptions used to
# project the future subspecialty workforce. The numbers represent the estimated
# annual number of new fellows entering the workforce for each subspecialty.
#
# The 'default' scenario represents our current best estimate based on recent
# data and trends. The other scenarios are used for sensitivity analysis to
# understand how changes in fellowship numbers could impact the workforce projections.
#
# Last updated: 2026-01-13
# Source: ACGME fellowship position allocations and analysis of recent trends.
#
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

# Default scenario (current best estimates)
# This scenario is used for the main analysis presented in the manuscript.
default:
  FPMRS: 60  # Female Pelvic Medicine & Reconstructive Surgery
  GO: 50     # Gynecologic Oncology
  MIG: 45    # Minimally Invasive Gynecologic Surgery

# Alternative scenarios for sensitivity analysis

# Optimistic scenario: Assumes a significant increase in fellowship positions.
optimistic:
  FPMRS: 70
  GO: 60
  MIG: 55

# Pessimistic scenario: Assumes a significant decrease in fellowship positions.
pessimistic:
  FPMRS: 50
  GO: 40
  MIG: 35

# Historical scenario: Uses fellowship numbers from before 2026 for comparison.
historical_2025:
  FPMRS: 47
  GO: 60
  MIG: 51

# Status quo scenario: Assumes that the current number of fellowship positions
# remains constant over the projection period.
status_quo:
  FPMRS: 55
  GO: 55
  MIG: 45

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Notes:
#
# - FPMRS: Also known as Urogynecology or URPS (Urogynecology and Reconstructive Pelvic Surgery).
# - Numbers represent annual fellowship graduates entering the workforce.
# - These scenarios can be modified or extended to test different policy interventions
#   or alternative future scenarios.
# - The scenario comparison can be run using the '04_compare_scenarios.R' script:
#   Rscript cliff/code/04_compare_scenarios.R
#
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
