# Cliff-local path registry (reviewer-improvement #5).
# ONE entry per external input; every workforce-cliff script resolves through
# wc_path() in R/workforce_cliff_engine.R instead of hardcoding absolute paths
# (previously 42 DuckDB + 29 cohort-CSV refs scattered across scripts).
# Machine-specific overrides: cliff/config/cliff_paths.local.yml (gitignored),
# or the env var named in `env` below.

cohort_csv:
  path: /Users/tylermuffly/isochrones/manuscript/tables/table1_physician_characteristics.csv
  env: WORKFORCE_COHORT_CSV

abu_crosswalk:
  path: /Users/tylermuffly/isochrones/data/abu_urology/abu_npi_crosswalk_2026-07-14.csv
  env: WORKFORCE_ABU_CROSSWALK

abu_net_new:
  # 2026-07-22: 270 original net-new + 38 reinstated urology-pathway urogynecologists
  # (28 with FPMRS taxonomy + 10 false ABOG-generalist NPI collisions) an over-broad
  # dedup had dropped; audit trail in abu_fpmrs_reinstated_38_2026-07-22.csv.
  path: /Users/tylermuffly/isochrones/data/abu_urology/abu_fpmrs_net_new_npis_active_2026-07-22.txt
  env: WORKFORCE_ABU_NET_NEW

signals_duckdb:
  # primary + fallback (macOS " 1" mount drift); first existing path wins
  path: /Volumes/MufflySamsung 1/DuckDB/nber_my_duckdb.duckdb
  fallback: /Volumes/MufflySamsung/DuckDB/nber_my_duckdb.duckdb
  env: WORKFORCE_SIGNALS_DUCKDB

state_registry:
  # State medical-board lifecycle registry (classifier external validation).
  path: /Users/tylermuffly/isochrones/data/state_licenses/state_board_lifecycle_registry.csv
  env: WORKFORCE_STATE_REGISTRY

medicare_prov_svc:
  # CMS Medicare Physician & Other Practitioners, by Provider and Service, 2024
  # (raw ~3.25 GB CMS download, re-downloadable). This is the source imported into
  # signals_duckdb; scripts query the DuckDB, not this CSV. Registered for lineage.
  # Set the real location via the env var or cliff_paths.local.yml.
  path: /Volumes/MufflySamsung 1/medicare/medicare_prov_svc_2024.csv
  env: WORKFORCE_MEDICARE_PROV_SVC

hpsa_shp:
  # HRSA Health Professional Shortage Area shapefile (public; ~270 MB .shp bundle).
  path: /Volumes/MufflySamsung 1/hrsa/HPSA_CMPPC_SHP_DET_CUR_VX.shp
  env: WORKFORCE_HPSA_SHP

dpmm_demand_contract:
  # Versioned demand-hierarchy artifact emitted by the simulation repo (DPMM):
  # simulation/R/export_demand_contract.R -> dpmm_demand_contract_v<ver>.csv.
  # Consumed as an ALTERNATIVE D1 (dynamic prevalence) in the demand-denominator
  # sensitivity, behind the CLIFF_USE_DPMM_DEMAND flag. Optional by design: if the
  # file is absent the sensitivity falls back to the published anchors. The DPMM
  # model is currently uncalibrated (see its calibration_status column), so this
  # path is off by default. Point it at your local simulation checkout output.
  path: /Users/tylermuffly/simulation/dpmm_outputs/dpmm_demand_contract_v0.1.0.csv
  env: WORKFORCE_DPMM_DEMAND_CONTRACT

hdmm_demand_contract:
  # Versioned demand-hierarchy artifact emitted by the simulation repo's
  # reproductive life-course model (HDMM): simulation/R/export_demand_contract.R
  # export_hdmm_demand_contract() -> hdmm_demand_contract_v<ver>.csv. Carries
  # tiers 5-6 (tier5_care_seeking, tier6_procedural). Read with the same generic
  # seam as the DPMM contract: read_dpmm_demand_contract() + dpmm_alt_d1_index(
  # tier = "tier6_procedural"). Optional by design: absent file -> published
  # anchors. The HDMM coefficient tables are placeholders (see the contract's
  # calibration_status column), so this is off by default. Point it at your local
  # simulation checkout output.
  path: /Users/tylermuffly/simulation/dpmm_outputs/hdmm_demand_contract_v0.1.0.csv
  env: WORKFORCE_HDMM_DEMAND_CONTRACT

dmdm_demand_contract:
  # Versioned demand artifact emitted by the simulation repo's dynamic multistate
  # disease model (DMDM): simulation/R/export_demand_contract.R
  # export_dmdm_demand_contract() -> dmdm_demand_contract_v<ver>.csv. Carries
  # tier3_prevalent_pfd (any-PFD dynamic prevalence) plus per-condition tiers
  # (dmdm_ui/dmdm_pop/dmdm_ai). Read with the same generic seam:
  # read_dpmm_demand_contract() + dpmm_alt_d1_index(tier = ...). Optional by
  # design: absent file -> published anchors, so it is off by default.
  # PROVENANCE IS PER TIER: when the contract is built from the literature POP
  # transitions (simulation R/33), it also carries a tier_calibration_status
  # column stamping dmdm_pop = "derived_by_analogy" while dmdm_ui/dmdm_ai stay
  # "placeholder_uncalibrated" and tier3 takes the weakest input status. Gate on
  # dpmm_tier_status(ct, tier) for the specific tier you read, not the object-level
  # calibration_status. Point it at your local simulation checkout output.
  path: /Users/tylermuffly/simulation/dpmm_outputs/dmdm_demand_contract_v0.1.0.csv
  env: WORKFORCE_DMDM_DEMAND_CONTRACT

access_surface:
  # Tract-level drive-time access surface emitted by the simulation repo's E2SFCA
  # layer (run_geographic_access()$access), whose decay + wait response are fitted
  # and geographically validated by the isochrone access-response pipeline
  # (simulation/R/calibration-isochrone_access_response.R). Columns: demand_id
  # (11-digit tract GEOID), access, population (+ optional access_scaled,
  # n_providers, and provenance: isochrone_run_id/sigma/wait_scale/
  # calibration_status). Consumed by Module D v2 as the drive-time refinement of
  # the straight-line county access metric, ON BY DEFAULT when the file resolves
  # and is geographically validated (CLIFF_USE_ACCESS_SURFACE=0 disables it,
  # =force includes an un-validated surface). Optional by design: absent /
  # unreadable / un-validated file -> Module D v1 (straight-line) only.
  path: /Users/tylermuffly/simulation/dpmm_outputs/access_surface_v0.1.0.csv
  env: WORKFORCE_ACCESS_SURFACE
